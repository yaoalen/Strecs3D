name: Build Strecs3D Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BUILD_TYPE: release
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and Build
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "build/vcpkg-manifest-install.log") {
              Get-Content "build/vcpkg-manifest-install.log" -Tail 60
            }
            exit 1
          }
          cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Strecs3D-Windows-TC
          path: build/Release/
