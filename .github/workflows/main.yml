name: Build Strecs3D Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Rewind vcpkg to 2025-07 (OpenCASCADE 7.x)
        run: |
          Set-Location $env:VCPKG_INSTALLATION_ROOT
          git fetch --shallow-since="2025-07-01" origin master
          $commit = git rev-list -n 1 --before="2025-08-01" origin/master
          git checkout -f $commit

      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-win2022-202507-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-win2022-202507-${{ hashFiles('vcpkg.json') }}-

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and Build
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-release
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "build/vcpkg-manifest-install.log") {
              Get-Content "build/vcpkg-manifest-install.log" -Tail 60
            }
            exit 1
          }
          cmake --build build --config Release

      - name: Deploy Qt Dependencies
        run: |
          $windeployqt = Get-ChildItem -Path . -Filter "windeployqt.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe = Get-ChildItem -Path "build/Release" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($windeployqt -and $exe) {
            & $windeployqt.FullName --release --no-translations $exe.FullName
          }

      - name: Save vcpkg cache (even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-win2022-202507-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strecs3D-Windows-TC
          path: build/Release/
